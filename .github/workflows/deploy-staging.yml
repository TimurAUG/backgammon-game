name: deploy staging

on:
  push:
    branches: [develop]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          go list ./... | grep -vE '/internal/(auth|game)($|/)' | xargs go test -short
          go test ./internal/auth/... ./internal/game/...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend tests, types, and lint
        working-directory: web
        run: |
          npm test
          npm run check
          npm run lint

  deploy:
    name: deploy staging
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://nardy-staging.fly.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy nardy-staging
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
