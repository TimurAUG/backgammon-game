# fly.toml app configuration file generated for nardy-staging on 2026-11-11T13:18:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nardy-staging'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
